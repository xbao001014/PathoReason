function runs(){if(runScope==='innovation')return `<div class="filters"><button data-scope="baseline">基线实验</button><button class="active" data-scope="innovation">创新实验</button></div><section class="card"><div class="card-head"><h2>创新方案的实验与消融</h2>${b('尚未关联候选运行')}</div><div class="empty"><h3>等待方案与实验条件关联</h3><p>按候选修订、完整方法、原始基线、移除模块及区分对照组织；不计入原七模型 baseline 矩阵。</p><div class="compactactions"><button class="primary" data-tab="innovation">查看创新方案</button></div></div></section>`;return `<div class="filters"><button class="active" data-scope="baseline">基线实验</button><button data-scope="innovation">创新实验</button></div>`+`<section class="card"><div class="card-head"><h2>实验矩阵</h2>${b('实时作业尚未接入','amber')}</div><p class="muted">${task==='risk'?'方案记录 7 模型 × 3 种子。以下是计划槽位，— 表示没有可展示的结构化运行状态。':'历史任务只读浏览。不能借用当前危险度矩阵代表旧任务的执行结果。'}</p>${task==='risk'?`<div class="scrolltable"><table class="matrix"><thead><tr><th>模型</th><th>种子 20261031</th><th>种子 20261032</th><th>种子 20261033</th></tr></thead><tbody>${models.map(m=>`<tr><td>${m}</td>${[1,2,3].map(()=>'<td><span class="cell" title="作业状态待核对">—</span></td>').join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">历史运行关系待核对，可从阶段材料查看原始试跑记录。</div>'}<div class="key"><span>成功、失败、运行与未开始分开计数</span><span>未知不计为未开始或完成</span></div></section><section class="card"><div class="card-head"><h3>运行详情将绑定实际执行版本</h3>${btn('查看状态边界','source')}</div><p class="muted">具体运行 → 方案修订 → 代码快照 → 配置与数据清单 → 日志、检查点和结果。修改工作目录不改变已运行版本。</p><p class="note">进度按真实回执更新；旧 smoke、对齐验证、正式矩阵分开，不能累加为同一 benchmark 完成数。</p></section>`}
function render(){ $('#title').textContent=task==='risk'?'GIST 危险度三分类':'GIST vs 平滑肌瘤';$('#context').textContent=task==='risk'?'当前对话研究主线':'历史研究方向 · 拟议分组';$('#subtitle').textContent=task==='risk'?'患者级固定留出 · 七模型比较研究':'保留原方案、试跑与任务切换依据';renderStages();if(innerWidth<=700){const focusStage=document.querySelector(".stage.selected")||document.querySelector(".stage.current");if(focusStage)$("#stages").scrollLeft=focusStage.offsetLeft-$("#stages").firstElementChild.offsetLeft;}document.querySelectorAll('#tabs button').forEach(x=>{x.classList.toggle('active',x.dataset.tab===tab);if(x.dataset.tab===tab)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});$('#panel').innerHTML=({overview,innovation,materials,history,runs})[tab]();if(tab==='overview')$('#panel').insertAdjacentHTML('beforeend','<section class="card"><div class="card-head"><h3>创新方案</h3><span class="badge">尚未关联</span></div><p class="muted">候选机制、选择理由、方法变化及验证证据，在同一研究对象下持续修订。</p><div class="compactactions"><button data-tab="innovation">查看创新方案</button></div></section>');}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render()}if(el.dataset.stage!==undefined){stage=Number(el.dataset.stage);tab=stage===4?'innovation':stage===5?'runs':'materials';if(stage===5)runScope='innovation';render()}if(el.dataset.task){task=el.dataset.task;innovationDemo=false;candidate='module';runScope='baseline';$('#taskmenu').hidden=true;$('#tasktoggle').setAttribute('aria-expanded','false');render()}if(el.dataset.demo){innovationDemo=el.dataset.demo==='on';render()}if(el.dataset.candidate){candidate=el.dataset.candidate;render()}if(el.dataset.scope){runScope=el.dataset.scope;render()}if(el.dataset.modal){const [title,body]=mods[el.dataset.modal];$('#detailtitle').textContent=title;$('#detailbody').innerHTML=body;$('#detail').showModal()} });
$('#tasktoggle').onclick=()=>{const show=$('#taskmenu').hidden;$('#taskmenu').hidden=!show;$('#tasktoggle').setAttribute('aria-expanded',String(show));if(show)$('#taskmenu button').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#taskmenu').hidden){$('#taskmenu').hidden=true;$('#tasktoggle').setAttribute('aria-expanded','false');$('#tasktoggle').focus()}});$('#close').onclick=()=>$('#detail').close();$('#collapse').onclick=()=>$('#layout').classList.toggle('collapsed');
const query=new URLSearchParams(location.search);if(['overview','innovation','materials','history','runs'].includes(query.get('view')))tab=query.get('view');if(query.get('task')==='binary')task='binary';render();
</script></body></html>
